<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#101922"/><title>S.O.S. — Shared Mission Tracking</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,rgba(255,107,53,.22),transparent 35%),linear-gradient(160deg,#071018,#101922 58%,#05080d);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px}.shell{max-width:760px;margin:0 auto}.brand{display:flex;align-items:center;gap:11px}.mark{width:46px;height:46px;border-radius:15px;background:#ff6b35;display:grid;place-items:center;font-weight:1000}.brand strong{display:block;font-size:14px;letter-spacing:.06em}.brand span{font-size:9px;letter-spacing:.12em;color:#a9bac6}.card{margin-top:22px;background:rgba(15,25,35,.94);border:1px solid rgba(255,255,255,.1);border-radius:24px;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.42)}.map{height:330px;background:#101922;position:relative}.map iframe{width:100%;height:100%;border:0;filter:saturate(.8) contrast(1.05)}.pill{position:absolute;top:14px;left:14px;background:rgba(16,25,34,.9);padding:8px 10px;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.08em}.sheet{padding:20px}.k{font-size:9px;font-weight:900;letter-spacing:.13em;color:#ff9d77}.sheet h1{font-size:30px;margin:6px 0 6px;letter-spacing:-.03em}.sub{color:#aabac5;font-size:12px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.fact{padding:12px;background:rgba(255,255,255,.055);border-radius:14px}.fact small{font-size:8px;color:#8396a2;display:block}.fact strong{font-size:13px;display:block;margin-top:3px}.hero{margin-top:12px;padding:13px;border-radius:15px;background:rgba(255,107,53,.1);border:1px solid rgba(255,138,91,.22)}.hero small{font-size:8px;color:#ff9d77;font-weight:900}.hero strong{display:block;margin-top:3px}.msg{margin-top:28px;padding:20px;text-align:center;color:#aebec7;font-size:12px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(15,25,34,.72)}.foot{font-size:9px;color:#778b97;margin-top:12px;text-align:center}@media(max-width:560px){body{padding:12px}.map{height:280px}.sheet h1{font-size:25px}.grid{grid-template-columns:1fr 1fr}.grid .fact:last-child{grid-column:1/-1}}</style></head><body><main class="shell"><div class="brand"><div class="mark">SOS</div><div><strong>S.O.S. — SUPERHEROES ON STANDBY</strong><span>TRUSTED LIVE MISSION TRACKING</span></div></div><section id="card" class="card" hidden><div class="map" id="map"><div class="pill" id="livePill">LIVE MISSION</div></div><div class="sheet"><div class="k" id="status">ACTIVE MISSION</div><h1 id="service">Roadside mission</h1><div class="sub" id="address"></div><div class="grid"><div class="fact"><small>DISTANCE</small><strong id="distance">—</strong></div><div class="fact"><small>ETA</small><strong id="eta">—</strong></div><div class="fact"><small>GPS</small><strong id="gps">Waiting</strong></div></div><div class="hero" id="hero" hidden><small>ASSIGNED HERO</small><strong id="heroName"></strong><span class="sub" id="heroMeta"></span></div></div></section><div id="message" class="msg">Opening trusted mission tracking…</div><div class="foot">This temporary link shares mission progress only. It does not grant access to the customer’s S.O.S. account.</div></main><script>const ENDPOINT='https://cxdqkjvtpilvouwtbgdy.supabase.co/functions/v1/sos-shared-mission';const token=new URLSearchParams(location.search).get('token')||'';const $=id=>document.getElementById(id);let timer=null;function age(ts){if(!ts)return'Waiting';const s=Math.max(0,Math.floor((Date.now()-new Date(ts).getTime())/1000));return s<10?'Live':s<60?s+'s ago':Math.floor(s/60)+'m ago'}function mapUrl(lat,lng,destLat,destLng){const a=Number(lat),b=Number(lng),x=Number(destLat??lat),y=Number(destLng??lng);return'https://www.openstreetmap.org/export/embed.html?bbox='+(b-.035)+'%2C'+(a-.025)+'%2C'+(b+.035)+'%2C'+(a+.025)+'&layer=mapnik&marker='+x+'%2C'+y}async function load(){if(!/^[a-f0-9]{48}$/i.test(token)){showError('This mission tracking link is invalid.');return}try{const r=await fetch(ENDPOINT+'?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok){showError(d.error||'Tracking link unavailable.');if(r.status===410&&timer)clearInterval(timer);return}$('message').hidden=true;$('card').hidden=false;$('status').textContent=String(d.mission?.status||'').replaceAll('_',' ').toUpperCase();$('service').textContent=d.mission?.service_name||'Roadside mission';$('address').textContent=d.mission?.pickup_address||'Mission location';$('distance').textContent=d.distance_miles==null?'—':Number(d.distance_miles).toFixed(1)+' mi';$('eta').textContent=d.eta_minutes?d.eta_minutes+' min':'—';$('gps').textContent=age(d.live_location?.updated_at);if(d.hero){$('hero').hidden=false;$('heroName').textContent=d.hero.name||'S.O.S. Hero';$('heroMeta').textContent='★ '+Number(d.hero.rating||5).toFixed(1)+' · '+Number(d.hero.completed_missions||0)+' missions'}else $('hero').hidden=true;const lat=d.live_location?.lat??d.mission?.lat,lng=d.live_location?.lng??d.mission?.lng;if(lat!=null&&lng!=null){$('map').querySelector('iframe')?.remove();const f=document.createElement('iframe');f.title='Shared S.O.S. mission map';f.src=mapUrl(lat,lng,d.mission?.lat,d.mission?.lng);f.loading='lazy';$('map').prepend(f)}$('livePill').textContent=d.share?.terminal?'MISSION CLOSED':'LIVE MISSION';if(d.share?.terminal&&timer){clearInterval(timer);timer=null}}catch{showError('Tracking is temporarily unavailable.')}}function showError(text){$('card').hidden=true;$('message').hidden=false;$('message').textContent=text}load();timer=setInterval(load,10000);</script></body></html>
