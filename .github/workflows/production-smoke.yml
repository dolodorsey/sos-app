name: SOS Production Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '29 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sos-production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public production routes
        shell: bash
        env:
          BASE_URL: https://thesuperherosonstandby.com
        run: |
          set -euo pipefail
          routes=(
            "/"
            "/app"
            "/hero"
            "/hero/apply"
            "/hero/claim"
            "/ops/heroes"
            "/privacy"
            "/terms"
            "/support"
            "/auth/confirm"
            "/auth/reset"
          )
          for route in "${routes[@]}"; do
            out="$(mktemp)"
            code="$(curl -L --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 25 -o "$out" -w '%{http_code}' "${BASE_URL}${route}")"
            if [[ "$code" != "200" ]]; then
              echo "Production route failed: ${route} -> HTTP ${code}"
              cat "$out"
              exit 1
            fi
            bytes="$(wc -c < "$out" | tr -d ' ')"
            if [[ "$bytes" -lt 200 ]]; then
              echo "Production route returned an unexpectedly small response: ${route} (${bytes} bytes)"
              cat "$out"
              exit 1
            fi
            echo "OK ${route} (${bytes} bytes)"
            rm -f "$out"
          done

      - name: Verify production brand shell and web manifest
        shell: bash
        run: |
          set -euo pipefail
          home="$(curl -L --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 25 https://thesuperherosonstandby.com/)"
          grep -Eqi 'S\.O\.S\.|SUPERHEROES ON STANDBY|SUPERHEROES' <<<"$home" || { echo 'S.O.S. production brand shell is missing'; exit 1; }
          manifest_code="$(curl -L --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 25 -o /dev/null -w '%{http_code}' https://thesuperherosonstandby.com/manifest.webmanifest)"
          if [[ "$manifest_code" != "200" && "$manifest_code" != "404" ]]; then
            echo "Unexpected manifest response: HTTP ${manifest_code}"
            exit 1
          fi
          echo 'S.O.S. production smoke passed.'
